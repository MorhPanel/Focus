name: Build Windows
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10

      - name: Setup Visual Studio Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare AyuGram Libraries
        run: |
          Telegram\build\prepare\win.bat

      - name: Configure Telegram
        run: |
          cd Telegram
          cmd.exe /c configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build AyuGram
        run: |
          cmake --build out --config Release --target Telegram

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Focus-Windows-x64
          path: |
            out/Release/AyuGram.exe
            out/bin/Release/Telegram.exe
            out/Release/Telegram.exe
            out/bin/Telegram.exe
