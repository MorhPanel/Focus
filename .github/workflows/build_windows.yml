name: Build Windows
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: 3.10
          check-latest: true

      - name: Setup Visual Studio Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare AyuGram Libraries
        shell: pwsh
        run: |
           = (Get-Command python).Source
          Write-Host Active Python: 
          &  -V
          &  Telegram/build/prepare/prepare.py

      - name: Configure Telegram
        shell: pwsh
        run: |
           = (Get-Command python).Source
          cd Telegram
          &  configure.py -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build AyuGram
        shell: pwsh
        run: |
          cmake --build out --config Release --target Telegram

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Focus-Windows-x64
          path: |
            out/Release/AyuGram.exe
            out/bin/Release/Telegram.exe
            out/Release/Telegram.exe
            out/bin/Telegram.exe
